# ============================================================================
# APPROACH 2 — promotion gate
#
# Two things are enforced on every PR:
#
#   A) WHICH SOURCE BRANCHES may target this base at all
#   B) WHETHER the work has already passed through the earlier environment
#
# ---------------------------------------------------------------------------
# ALLOWED SOURCES                     ORDER CHECK
#
#   -> corp-dev    feature/* bugfix/*    must be cut from master
#                  hotfix/*  sync/*      (none — back-merge / emergency)
#
#   -> corp-qa     feature/* bugfix/*    must already be in corp-dev
#                  hotfix/*  sync/*      (none)
#
#   -> release/*   feature/* bugfix/*    must already be in corp-qa
#                  hotfix/*  sync/*      (none)
#
#   -> master      release/*             every commit must be in corp-qa
#                  hotfix/*              (none — production emergency)
#                  revert/*              (none — rollback follow-up)
#
# NOTE: corp-dev -> corp-qa is deliberately NOT allowed. That would promote
# the whole branch instead of the feature, which is the contamination problem
# the release train exists to prevent. Features reach corp-qa from their own
# branch, exactly as they reached corp-dev.
# ---------------------------------------------------------------------------
#
# Bypass: label the PR  emergency-hotfix
# REQUIRES merge-commit strategy. Squash/rebase create new commit ids and
# every ancestry check fails incorrectly.
# ============================================================================

name: promotion_gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [corp-dev, corp-qa, 'release/**', master]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Fetch comparison branches
        run: git fetch origin master corp-dev corp-qa --quiet || true

      - name: Emergency bypass?
        id: bypass
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'emergency-hotfix') }}; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "::warning::EMERGENCY BYPASS by ${{ github.actor }} — gate skipped"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce promotion rules
        if: steps.bypass.outputs.active == 'false'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          fail () { echo "::error::$1"; exit 1; }

          echo "PR: $HEAD_REF  ->  $BASE_REF"
          echo

          # ================= A. allowed source branches =====================
          case "$BASE_REF" in
            corp-dev|corp-qa)
              case "$HEAD_REF" in
                feature/*|bugfix/*|hotfix/*|sync/*) ;;
                corp-dev)
                  fail "corp-dev cannot be merged into corp-qa. That promotes the whole branch instead of the feature. Merge the feature branch into corp-qa directly." ;;
                *)
                  fail "'$HEAD_REF' may not target $BASE_REF. Allowed: feature/*, bugfix/*, hotfix/*, sync/*" ;;
              esac ;;
            release/*)
              case "$HEAD_REF" in
                feature/*|bugfix/*|hotfix/*|sync/*) ;;
                *) fail "'$HEAD_REF' may not target a release branch. Allowed: feature/*, bugfix/*, hotfix/*, sync/*" ;;
              esac ;;
            master)
              case "$HEAD_REF" in
                release/*|hotfix/*|revert/*) ;;
                *) fail "'$HEAD_REF' may not target master. Allowed: release/*, hotfix/*, revert/*" ;;
              esac ;;
          esac
          echo "Source branch allowed for this target."
          echo

          # Emergency, back-merge and rollback branches skip the order check:
          # by definition they are not following the normal promotion path.
          case "$HEAD_REF" in
            hotfix/*|sync/*|revert/*)
              echo "'$HEAD_REF' is an out-of-band branch — promotion order not enforced."
              if [[ "$HEAD_REF" == hotfix/* && "$BASE_REF" == "master" ]]; then
                echo "::warning::Remember to back-merge master into corp-qa and corp-dev, and into any open release branch."
              fi
              exit 0 ;;
          esac

          # ================= B. promotion order =============================
          case "$BASE_REF" in

            corp-dev)
              echo "Rule: the branch must be cut from master, not from corp-dev."
              BAD=""
              for c in $(git rev-list "$HEAD_SHA" --not origin/master --no-merges | head -200); do
                git merge-base --is-ancestor "$c" origin/corp-dev 2>/dev/null && BAD="$BAD $c"
              done
              if [[ -n "$BAD" ]]; then
                echo "Commits already in corp-dev but not in master:"
                for c in $BAD; do git log -1 --oneline "$c"; done
                fail "'$HEAD_REF' looks branched from corp-dev. Recreate it from master: git checkout -b $HEAD_REF origin/master"
              fi
              echo "PASS — history contains only master plus its own commits."
              ;;

            corp-qa)
              echo "Rule: must already be merged into corp-dev."
              if git merge-base --is-ancestor "$HEAD_SHA" origin/corp-dev; then
                echo "PASS — found in corp-dev."
              else
                fail "'$HEAD_REF' is not in corp-dev yet (or has newer commits since). Merge it to corp-dev and test there first."
              fi
              ;;

            release/*)
              echo "Rule: must already be merged into corp-qa."
              if git merge-base --is-ancestor "$HEAD_SHA" origin/corp-qa; then
                echo "PASS — found in corp-qa."
              else
                fail "'$HEAD_REF' is not in corp-qa yet. It cannot enter the release before QA has seen it."
              fi
              ;;

            master)
              echo "Rule: every commit in this release must already be in corp-qa."
              MISSING=""
              for c in $(git rev-list origin/master.."$HEAD_SHA" --no-merges); do
                git merge-base --is-ancestor "$c" origin/corp-qa 2>/dev/null || MISSING="$MISSING $c"
              done
              if [[ -n "$MISSING" ]]; then
                echo "Commits QA has never seen:"
                for c in $MISSING; do git log -1 --oneline "$c"; done
                fail "This release contains code never merged into corp-qa."
              fi
              echo "PASS — all $(git rev-list --count origin/master.."$HEAD_SHA" --no-merges) commit(s) verified in corp-qa."
              ;;
          esac
